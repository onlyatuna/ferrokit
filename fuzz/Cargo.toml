[package]
name = "ferrokit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ferrokit-core = { path = "../crates/ferrokit-core" }
ferrokit-gui = { path = "../crates/ferrokit-gui", default-features = false }
ferrokit-platform = { path = "../crates/ferrokit-platform", features = ["test-hooks"] }

# Not a member of the root workspace: it needs nightly and is not built by CI.
[workspace]

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_stream"
path = "fuzz_targets/data_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "variant"
path = "fuzz_targets/variant.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qcssparser"
path = "fuzz_targets/qcssparser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dbus_frame"
path = "fuzz_targets/dbus_frame.rs"
test = false
doc = false
bench = false
