[package]
name = "ferrokit-platform"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Native windows, screens, tray icons and other platform services of ferrokit (Windows first; other back ends are experimental)."
license = "LGPL-3.0-only"
repository = "https://github.com/onlyatuna/ferrokit"
publish = false

[dependencies]
ferrokit-core = { path = "../ferrokit-core" }
ferrokit-gui = { path = "../ferrokit-gui" }
bitflags = "2.4"
raw-window-handle = "0.6"
tinyfiledialogs = "3.9.1"
[features]
default = []
test-hooks = []
[dev-dependencies]
parking_lot = "0.12"
ferrokit-platform = { path = ".", features = ["test-hooks"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Future dependencies: zbus, x11rb / wayland-client

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["catch-all", "relax-void-encoding", "disable-encoding-assertions"] }

[lints]
workspace = true

[[test]]
name = "platform"
path = "tests/platform.rs"

# Kept as its own binary: needs a fresh process.
[[test]]
name = "test_style_hints_main_thread"
path = "tests/test_style_hints_main_thread.rs"

# Kept as its own binary: needs a fresh process.
[[test]]
name = "test_single_instance"
path = "tests/test_single_instance.rs"

# Kept as its own binary: needs a fresh process.
[[test]]
name = "test_window_native_behavior"
path = "tests/test_window_native_behavior.rs"
