[package]
name = "ferrokit-core"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Object model, events, signals and slots, timers and event loop of ferrokit, a Rust implementation of a subset of Qt."
license = "LGPL-3.0-only"
repository = "https://github.com/onlyatuna/ferrokit"
publish = false

[dependencies]
parking_lot = "0.12"
ferrokit-derive = { path = "../ferrokit-derive", optional = true }

[features]
default = ["derive"]
derive = ["dep:ferrokit-derive"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Future dependencies: epoll platform event mechanisms

[target.'cfg(target_os = "macos")'.dependencies]
# Future dependencies: kqueue, core-foundation

[lints]
workspace = true

[[test]]
name = "core"
path = "tests/core.rs"

# Kept as its own binary: needs a fresh process.
[[test]]
name = "test_compressor_panic_cleanup"
path = "tests/test_compressor_panic_cleanup.rs"

# Kept as its own binary: needs a fresh process.
[[test]]
name = "test_main_thread_first_caller"
path = "tests/test_main_thread_first_caller.rs"

# Kept as its own binary: needs a fresh process.
[[test]]
name = "test_parent_thread_affinity"
path = "tests/test_parent_thread_affinity.rs"

# Kept as its own binary: needs a fresh process.
[[test]]
name = "test_pool_worker_not_main"
path = "tests/test_pool_worker_not_main.rs"
