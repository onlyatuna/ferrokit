name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  j0:
    if: github.event.action != 'labeled'
    name: Workspace Test (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  j1:
    if: github.event.action != 'labeled'
    name: Workspace Test (windows-latest)
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  j2:
    if: github.event.action != 'labeled'
    name: Workspace Test (macos-latest)
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  j3:
    if: github.event.action != 'labeled'
    name: Concurrency Model Tests (std)
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  j4:
    if: github.event.action != 'labeled'
    name: Concurrency Model Tests (loom)
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  j5:
    if: github.event.action != 'labeled'
    name: Concurrency Model Tests (shuttle)
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  j6:
    if: github.event.action != 'labeled'
    name: Concurrency Model ThreadSanitizer
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
