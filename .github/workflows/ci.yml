name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    if: github.event.action != 'labeled'
    name: Workspace Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  model:
    if: github.event.action != 'labeled'
    name: Concurrency Model Tests (${{ matrix.suite }})
    strategy:
      matrix:
        suite: [std, loom, shuttle]
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
  model-tsan:
    if: github.event.action != 'labeled'
    name: Concurrency Model ThreadSanitizer${{ matrix.variant }}
    strategy:
      matrix:
        variant: [""]
    runs-on: ubuntu-22.04
    steps:
      - run: echo ok
