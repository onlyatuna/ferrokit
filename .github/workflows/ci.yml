name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Workspace Test (${{ matrix.os }})
    # Some tests are known to hang when run serially; cap a stuck run instead of the 6 h default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust version
        run: rustc -V && cargo -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config
          # The font tests resolve Arial and a CJK fallback, as they do on Windows.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer fonts-noto-cjk
          fc-list | grep -iE "arial|noto sans cjk" | head -n 5

      # Lists every target that does not compile on this platform; `cargo test` stops at the first.
      - name: Compile every target (cargo check --keep-going)
        run: cargo check --workspace --all-targets --keep-going
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # One binary at a time with a time limit each, so one hang does not hide the rest.
      - name: Run test binaries (per-binary timeout)
        # 120 s: about 5x the slowest normal target observed (test_tooltip, 23.1 s on Windows).
        # Builds use every runner core; the targets still run one at a time.
        run: python tools/run_test_binaries.py --timeout 120 --jobs 4

      # libtest runs tests on worker threads; this runs GuiApplication/CoreApplication on the OS
      # main thread, one child process per check with its own time limit.
      - name: macOS main-thread entry (application dispatcher and event loop)
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: cargo run -q -p ferrokit-gui --example main_thread_entry

      # ferrokit-platform AppKit checks (windows, status items, menus, screens, cursor, theme) on the
      # OS main thread, one child process per check, reporting ok/FAILED/ENV/CRASH per check.
      # Known open: status_item_message (ENV: no app bundle). Any other check not ok, or a listed
      # one passing, fails the step.
      - name: macOS main-thread AppKit checks (ferrokit-platform)
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: >-
          cargo run -q -p ferrokit-platform --example appkit_main_thread --
          --known-open=status_item_message

      - name: Run doc tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc

  miri-shard:
    name: Miri shard (${{ matrix.crate }}, ${{ matrix.model }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One entry per (crate, model, shard); a shard's sweep is estimated well under 40 minutes.
        include:
          - {crate: ferrokit-core, baseline: tools/miri_baseline.json, model: SB, shard: 1, shards: 2}
          - {crate: ferrokit-core, baseline: tools/miri_baseline.json, model: SB, shard: 2, shards: 2}
          - {crate: ferrokit-core, baseline: tools/miri_baseline.json, model: TB, shard: 1, shards: 2}
          - {crate: ferrokit-core, baseline: tools/miri_baseline.json, model: TB, shard: 2, shards: 2}
          - {crate: ferrokit-gui, baseline: tools/miri_baseline_ferrokit_gui.json, model: SB, shard: 1, shards: 1}
          - {crate: ferrokit-gui, baseline: tools/miri_baseline_ferrokit_gui.json, model: TB, shard: 1, shards: 1}
          - {crate: ferrokit-widgets, baseline: tools/miri_baseline_ferrokit_widgets.json, model: SB, shard: 1, shards: 1}
          - {crate: ferrokit-widgets, baseline: tools/miri_baseline_ferrokit_widgets.json, model: TB, shard: 1, shards: 1}
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Miri toolchain
        run: |
          rustup toolchain install nightly-2026-10-16 --profile minimal -c miri -c rust-src
          cargo +nightly-2026-10-16 miri setup
          rustc +nightly-2026-10-16 -V

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Miri sweep tool unit tests
        run: python -m unittest tools/test_miri_sweep.py

      - name: Run Miri sweep (${{ matrix.crate }}, ${{ matrix.model }}, shard ${{ matrix.shard }}/${{ matrix.shards }}, baseline diff, isolation allowlist)
        run: >-
          python tools/miri_sweep.py
          --crate ${{ matrix.crate }}
          --toolchain nightly-2026-10-16
          --models ${{ matrix.model }}
          --shard ${{ matrix.shard }}/${{ matrix.shards }}
          --baseline ${{ matrix.baseline }}
          --run-isolation-allowlist
          --fail-on-regression
          --summary "$GITHUB_STEP_SUMMARY"
          --out miri_results.json

  miri:
    # Required check name: keep "Nightly Miri (SB & TB)" stable; it aggregates the shards above.
    name: Nightly Miri (SB & TB)
    needs: miri-shard
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every Miri shard to succeed
        env:
          SHARD_RESULT: ${{ needs.miri-shard.result }}
        run: |
          echo "Miri shard results: $SHARD_RESULT"
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Miri shards did not all succeed (result: $SHARD_RESULT)"
            exit 1
          fi

  model:
    name: Concurrency Model Tests (${{ matrix.suite.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: std
            args: ""
          - name: loom
            args: "--features loom --test loom_tests"
          - name: shuttle
            args: "--features shuttle --test shuttle_tests"
    steps:
      - uses: actions/checkout@v7

      - name: Rust version
        run: rustc -V && cargo -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Model Test (${{ matrix.suite.name }})
        run: cargo test --manifest-path crates/ferrokit-model/Cargo.toml ${{ matrix.suite.args }}

  model-tsan:
    name: Concurrency Model ThreadSanitizer
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain with rust-src
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src
          rustc +nightly -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Native Stress with ThreadSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
        run: |
          cargo +nightly test --target x86_64-unknown-linux-gnu -Zbuild-std \
            --manifest-path crates/ferrokit-model/Cargo.toml --test stress_tests -- --nocapture
