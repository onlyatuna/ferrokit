name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` lets adding `miri` (run the affected crates) or `miri-full` (run every crate) start the sweep.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Full Miri sweep on main every night, whatever changed.
    - cron: '0 18 * * *'

# Read-only token by default; jobs that need more must request it explicitly.
permissions:
  contents: read

# A new push to a pull request cancels the superseded run; runs on main always finish.
# A `labeled` run has its own group: opening a PR with a label fires `opened` and `labeled` together,
# and they must not cancel each other (the cancelled run leaves cancelled required checks behind).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event.action != 'labeled'
    name: Workspace Test (${{ matrix.os }})
    # Some tests are known to hang when run serially; cap a stuck run instead of the 6 h default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust version
        run: rustc -V && cargo -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config
          # The font tests resolve Arial and a CJK fallback, as they do on Windows.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer fonts-noto-cjk
          fc-list | grep -iE "arial|noto sans cjk" | head -n 5

      # Lists every target that does not compile on this platform; `cargo test` stops at the first.
      - name: Compile every target (cargo check --keep-going)
        run: cargo check --workspace --all-targets --keep-going --locked

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # One binary at a time with a time limit each, so one hang does not hide the rest.
      - name: Run test binaries (per-binary timeout)
        # 120 s: about 5x the slowest normal target observed (test_tooltip, 23.1 s on Windows).
        # Builds use every runner core; the targets still run one at a time.
        run: python tools/run_test_binaries.py --timeout 120 --jobs 4

      # libtest runs tests on worker threads; this runs GuiApplication/CoreApplication on the OS
      # main thread, one child process per check with its own time limit.
      - name: macOS main-thread entry (application dispatcher and event loop)
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: cargo run --locked -q -p ferrokit-gui --example main_thread_entry

      # ferrokit-platform AppKit checks (windows, status items, menus, screens, cursor, theme) on the
      # OS main thread, one child process per check, reporting ok/FAILED/ENV/CRASH per check.
      # Known open: status_item_message (ENV: no app bundle). Any other check not ok, or a listed
      # one passing, fails the step.
      - name: macOS main-thread AppKit checks (ferrokit-platform)
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: >-
          cargo run --locked -q -p ferrokit-platform --example appkit_main_thread --
          --known-open=status_item_message

      - name: Run doc tests
        if: ${{ !cancelled() }}
        # Doc tests run after the binaries; cap a hang so the job still ends with a clear step result.
        timeout-minutes: 15
        run: cargo test --workspace --doc --locked

  # Non-required: the platform and widget tests that need an X server, run under a virtual one.
  # Not in the protect-main required checks; the required `Workspace Test (ubuntu-22.04)` is separate.
  test-xvfb:
    if: github.event.action != 'labeled'
    name: Workspace Test (ubuntu-22.04, Xvfb)
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config xvfb
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run platform and widget test binaries under xvfb-run
        run: >-
          xvfb-run -a python tools/run_test_binaries.py --timeout 120 --jobs 4
          --package ferrokit-platform --package ferrokit-widgets --test-threads 1

  miri-changes:
    # A `labeled` run only matters for the miri labels; every other job is skipped for it.
    if: github.event.action != 'labeled' || contains(fromJSON('["miri","miri-full"]'), github.event.label.name)
    name: Miri relevance
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          # tools/miri_scope.py maps changed paths to the crates whose Miri shards must run and
          # prints the shard matrix. Only pull requests have a base to diff against.
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE" "$HEAD" > changed.txt
          else
            : > changed.txt
          fi
          python3 tools/miri_scope.py --event "$EVENT" --labels-json "$LABELS" < changed.txt >> "$GITHUB_OUTPUT"

  miri-shard:
    needs: miri-changes
    if: needs.miri-changes.outputs.run == 'true'
    name: Miri shard (${{ matrix.crate }}, ${{ matrix.model }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One entry per (crate, model, shard), computed by `miri-changes` from the changed paths;
        # a shard's sweep is estimated well under 40 minutes.
        include: ${{ fromJSON(needs.miri-changes.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Miri toolchain
        run: |
          rustup toolchain install nightly-2026-10-16 --profile minimal -c miri -c rust-src
          cargo +nightly-2026-10-16 miri setup
          rustc +nightly-2026-10-16 -V

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Miri sweep tool unit tests
        run: python -m unittest tools/test_miri_sweep.py

      - name: Run Miri sweep (${{ matrix.crate }}, ${{ matrix.model }}, shard ${{ matrix.shard }}/${{ matrix.shards }}, baseline diff, isolation allowlist)
        run: >-
          python tools/miri_sweep.py
          --crate ${{ matrix.crate }}
          --toolchain nightly-2026-10-16
          --models ${{ matrix.model }}
          --shard ${{ matrix.shard }}/${{ matrix.shards }}
          --baseline ${{ matrix.baseline }}
          --run-isolation-allowlist
          --fail-on-regression
          --timeout 2700
          --summary "$GITHUB_STEP_SUMMARY"
          --out miri_results.json
        # --timeout is seconds per `cargo miri test` invocation (one target's remaining tests, plus
        # its first build), below the 60-minute job limit. On expiry the run is recorded as a timeout
        # result and the sweep carries on, instead of cancelling the job.

  miri:
    # Required check name: keep "Nightly Miri (SB & TB)" stable; it aggregates the shards above.
    name: Nightly Miri (SB & TB)
    needs: [miri-changes, miri-shard]
    if: always() && (github.event.action != 'labeled' || contains(fromJSON('["miri","miri-full"]'), github.event.label.name))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every Miri shard to succeed (or Miri not requested for this run)
        env:
          RELEVANT: ${{ needs.miri-changes.outputs.run }}
          CHANGES_RESULT: ${{ needs.miri-changes.result }}
          SHARD_RESULT: ${{ needs.miri-shard.result }}
        run: |
          echo "relevance: $CHANGES_RESULT run=$RELEVANT; shards: $SHARD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Miri relevance check failed ($CHANGES_RESULT)"; exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "No Miri-relevant crate affected by this run; shards skipped."; exit 0
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Miri shards did not all succeed (result: $SHARD_RESULT)"
            exit 1
          fi

  tools:
    if: github.event.action != 'labeled'
    name: Tools unit tests and Miri baseline coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run tools unit tests
        run: python -m unittest discover -s tools -p "test_*.py"

      # Every tests/*.rs of a swept crate must be in its baseline `targets` or `excluded`.
      - name: Check Miri baseline coverage
        run: |
          python tools/miri_sweep.py --crate ferrokit-core --baseline tools/miri_baseline.json --check-coverage
          python tools/miri_sweep.py --crate ferrokit-gui --baseline tools/miri_baseline_ferrokit_gui.json --check-coverage
          python tools/miri_sweep.py --crate ferrokit-widgets --baseline tools/miri_baseline_ferrokit_widgets.json --check-coverage

  model:
    if: github.event.action != 'labeled'
    name: Concurrency Model Tests (${{ matrix.suite.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: std
            args: ""
          - name: loom
            args: "--features loom --test loom_tests"
          - name: shuttle
            args: "--features shuttle --test shuttle_tests"
    steps:
      - uses: actions/checkout@v7

      - name: Rust version
        run: rustc -V && cargo -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Model Test (${{ matrix.suite.name }})
        run: cargo test --manifest-path crates/ferrokit-model/Cargo.toml --locked ${{ matrix.suite.args }}

  model-tsan:
    if: github.event.action != 'labeled'
    # A skipped job reports its unexpanded name. This job is a required check with a fixed name, and a
    # skipped run of that exact name (a `labeled` run) would replace the real result, so the name
    # carries an (empty) matrix value: skipped -> template text, real run -> the required name.
    name: Concurrency Model ThreadSanitizer${{ matrix.variant }}
    strategy:
      matrix:
        variant: [""]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned nightly toolchain with rust-src
        run: |
          rustup toolchain install nightly-2026-10-16 --profile minimal -c rust-src
          rustc +nightly-2026-10-16 -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Native Stress with ThreadSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
        run: |
          cargo +nightly-2026-10-16 test --locked --target x86_64-unknown-linux-gnu -Zbuild-std \
            --manifest-path crates/ferrokit-model/Cargo.toml --test stress_tests -- --nocapture
